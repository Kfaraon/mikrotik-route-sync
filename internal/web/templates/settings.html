{{define "settings.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройки — MikroTik Route Sync</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <script src="/static/htmx.min.js"></script>
    <style>
        .password-field { font-family: monospace; }
        .password-mask { color: #888; }
        .btn-show, .btn-edit, .btn-test, .btn-reset { margin-left: 0.5rem; }
    </style>
</head>
<body>
<main class="container">
    <h1>⚙️ Настройки</h1>
    <nav><a href="/">← Дашборд</a></nav>

    <section id="mikrotik-settings">
        <h2>MikroTik</h2>
        <div hx-get="/partials/settings" hx-trigger="config-changed from:body" hx-swap="innerHTML">
            <form hx-post="/actions/config/set" hx-swap="outerHTML">
                <input type="hidden" name="csrf_token" value="{{.CSRF}}">
                <label>Host: <input type="text" name="value" value="{{.MikroTik.Host}}">
                    <input type="hidden" name="key" value="mikrotik.host"></label>
                <button type="submit">Сохранить</button>
            </form>
            <form hx-post="/actions/config/set" hx-swap="outerHTML">
                <input type="hidden" name="csrf_token" value="{{.CSRF}}">
                <label>Username: <input type="text" name="value" value="{{.MikroTik.Username}}">
                    <input type="hidden" name="key" value="mikrotik.username"></label>
                <button type="submit">Сохранить</button>
            </form>
            <form hx-post="/actions/config/set" hx-swap="outerHTML">
                <input type="hidden" name="csrf_token" value="{{.CSRF}}">
                <label>Password:
                    <span class="password-field">
                        <span class="password-mask" id="mikrotik-password">••••••••</span>
                        <button type="button" class="btn-show" onclick="togglePassword('mikrotik-password', '{{.MikroTik.Password}}')">👁 Показать</button>
                        <button type="button" class="btn-edit" onclick="editPassword('mikrotik-password')">✏️ Изменить</button>
                    </span>
                    <input type="hidden" name="key" value="mikrotik.password">
                    <input type="text" name="value" style="display:none" id="mikrotik-password-input">
                </label>
                <button type="submit">Сохранить</button>
            </form>
            <button hx-post="/actions/test-mikrotik" hx-swap="outerHTML" class="btn-test">🧪 Проверить подключение</button>
        </div>
    </section>

    <section id="telegram-settings">
        <h2>Telegram</h2>
        <form hx-post="/actions/config/set" hx-swap="outerHTML">
            <input type="hidden" name="csrf_token" value="{{.CSRF}}">
            <label>Bot Token:
                <span class="password-field">
                    <span class="password-mask" id="telegram-token">••••••••</span>
                    <button type="button" class="btn-show" onclick="togglePassword('telegram-token', '{{.Telegram.BotToken}}')">👁</button>
                    <button type="button" class="btn-edit" onclick="editPassword('telegram-token')">✏️</button>
                </span>
                <input type="hidden" name="key" value="telegram.bot_token">
                <input type="text" name="value" style="display:none" id="telegram-token-input">
            </label>
            <button type="submit">Сохранить</button>
        </form>
        <button hx-post="/actions/test-telegram" hx-swap="outerHTML">🧪 Проверить Telegram</button>
    </section>

    <section>
        <h2>Общие</h2>
        <button hx-post="/actions/reload-config" hx-swap="outerHTML">🔄 Перечитать конфиг</button>
    </section>
</main>
<script>
function togglePassword(id, value) {
    const el = document.getElementById(id);
    if (el.textContent === '••••••••') {
        el.textContent = value;
        el.classList.remove('password-mask');
        setTimeout(() => {
            el.textContent = '••••••••';
            el.classList.add('password-mask');
        }, 10000);
    } else {
        el.textContent = '••••••••';
        el.classList.add('password-mask');
    }
}

function editPassword(id) {
    const el = document.getElementById(id);
    const input = document.getElementById(id + '-input');
    const current = el.textContent === '••••••••' ? '' : el.textContent;
    input.style.display = 'inline';
    input.value = current;
    input.focus();
    input.onblur = function() {
        el.textContent = input.value || '••••••••';
        input.style.display = 'none';
    };
}

// SSE для live-обновлений
const eventSource = new EventSource('/api/v1/sse');
eventSource.addEventListener('config-changed', (e) => {
    console.log('Config changed:', e.data);
    htmx.trigger('body', 'config-changed');
});
eventSource.addEventListener('config-reloaded', (e) => {
    location.reload();
});
</script>
</body>
</html>
{{end}}
