{{define "services.html"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>MikroTik Route Sync — Сервисы</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav class="container-fluid">
    <ul>
      <li><a href="/">🏠 Дашборд</a></li>
      <li><a href="/services" aria-current="page">📦 Сервисы</a></li>
      <li><a href="/schedules">📅 Расписания</a></li>
      <li><a href="/settings">⚙️ Настройки</a></li>
      <li><a href="/logs">📜 Логи</a></li>
    </ul>
  </nav>

  <main class="container">
    <h1>📦 Сервисы</h1>

    <form hx-post="/actions/sync-selected" hx-target="#sync-result" hx-swap="innerHTML">
      <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox"
                       onclick="document.querySelectorAll('input[name=service]').forEach(c=>c.checked=this.checked)"></th>
            <th>Сервис</th>
            <th>Расписание</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          {{ range .Services }}
          <tr>
            <td><input type="checkbox" name="service" value="{{ . }}"></td>
            <td>{{ . }}</td>
            <td>{{ effectiveSchedule . }}</td>
            <td>
              <button type="button" class="outline"
                      hx-post="/api/v1/services/{{ . }}/sync"
                      hx-headers='{"X-CSRF-Token":"{{ $.CSRF }}"}'
                      hx-confirm="Синхронизировать {{ . }}?">
                🔄
              </button>
            </td>
          </tr>
          {{ else }}
          <tr><td colspan="4" class="muted">Нет сервисов</td></tr>
          {{ end }}
        </tbody>
      </table>

      <div role="group">
        <button type="submit">▶️ Синхронизировать выбранные</button>
        <button type="button" class="secondary"
                hx-post="/actions/sync-all"
                hx-headers='{"X-CSRF-Token":"{{ .CSRF }}"}'
                hx-confirm="Синхронизировать ВСЕ сервисы?">
          🔄 Все сервисы
        </button>
      </div>
    </form>

    <div id="sync-result"></div>
  </main>
</body>
</html>
{{end}}
