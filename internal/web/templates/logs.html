{{define "logs.html"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Логи — MikroTik Route Sync</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ .CSRF }}">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/icons.css">
  <script src="/static/common.js"></script>
  <script src="/static/theme.js"></script>
</head>
<body>
{{template "icons" .}}
  <a class="mrs-skip" href="#logs-page">Перейти к содержимому</a>
  <nav class="bar">
    <span class="brand">MikroTik Route Sync</span>
    <a href="/"><svg class="px" aria-hidden="true" focusable="false"><use href="#px-dashboard"></use></svg><span class="bar-label">Дашборд</span></a>
    <a href="/address-list"><svg class="px" aria-hidden="true" focusable="false"><use href="#px-list"></use></svg><span class="bar-label">Списки адресов</span></a>
    <a href="/services"><svg class="px" aria-hidden="true" focusable="false"><use href="#px-services"></use></svg><span class="bar-label">Сервисы</span></a>
    <a href="/schedules"><svg class="px" aria-hidden="true" focusable="false"><use href="#px-clock"></use></svg><span class="bar-label">Расписания</span></a>
    <a href="/settings"><svg class="px" aria-hidden="true" focusable="false"><use href="#px-settings"></use></svg><span class="bar-label">Настройки</span></a>
    <a href="/logs" class="active" aria-current="page"><svg class="px" aria-hidden="true" focusable="false"><use href="#px-logs"></use></svg><span class="bar-label">Логи</span></a>
    <span class="bar-right">
      <span id="live-dot" class="{{ .DotClass }}" title="{{ .DotTitle }}"></span>
      <button type="button" class="theme-toggle" aria-label="Переключить тему"><svg class="px" aria-hidden="true" focusable="false"><use href="#px-moon"></use></svg></button>
    </span>
  </nav>

  <main class="wrap" id="logs-page" tabindex="-1">
    <div class="log-stats" id="log-stats">
      <span class="stat-item">Всего: <strong id="stat-total">0</strong></span>
      <span class="stat-item debug">DEBUG: <strong id="stat-debug">0</strong></span>
      <span class="stat-item ok">INFO: <strong id="stat-info">0</strong></span>
      <span class="stat-item warn">WARN: <strong id="stat-warn">0</strong></span>
      <span class="stat-item err">ERROR: <strong id="stat-err">0</strong></span>
    </div>

    <div class="log-toolbar">
      <div class="log-filters">
        <div class="filter-group">
          <label for="log-level">Уровень:</label>
          <select id="log-level">
            <option value="">Все уровни</option>
            <option value="DEBUG">DEBUG</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="log-service">Сервис:</label>
          <input type="text" id="log-service" placeholder="например: youtube">
        </div>

        <div class="filter-group">
          <label for="log-search">Поиск:</label>
          <input type="search" id="log-search" placeholder="текст, ключ, значение…">
        </div>

        <div class="filter-group">
          <label for="log-limit">Лимит:</label>
          <select id="log-limit">
            <option value="50">50 строк</option>
            <option value="100" selected>100 строк</option>
            <option value="500">500 строк</option>
            <option value="1000">1000 строк</option>
          </select>
        </div>
      </div>

      <div class="log-actions">
        <button type="button" id="log-refresh" class="btn btn-primary log-refresh"><svg class="px" aria-hidden="true" focusable="false"><use href="#px-sync"></use></svg> Обновить</button>
        <button type="button" id="log-pause" class="btn btn-secondary log-pause"><svg class="px" aria-hidden="true" focusable="false"><use href="#px-pause"></use></svg><span class="log-pause-label">Пауза</span></button>
        <button type="button" id="log-download" class="btn btn-outline"><svg class="px" aria-hidden="true" focusable="false"><use href="#px-download"></use></svg> Скачать</button>
        <button type="button" class="btn btn-secondary" id="log-clear"
                hx-post="/actions/logs-clear"
                hx-swap="none"
                hx-confirm="Очистить лог-файл?">
          <svg class="px" aria-hidden="true" focusable="false"><use href="#px-trash"></use></svg> Очистить
        </button>
      </div>
    </div>

    <article class="log-container">
      <div id="log-output" class="log-output compact">
        <div class="log-placeholder">Загрузка логов…</div>
      </div>
    </article>
  </main>

  <!-- Контейнер для уведомлений -->
  <div id="mrs-toast" class="toast"></div>

  <!-- Скрипты -->
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
{{end}}
