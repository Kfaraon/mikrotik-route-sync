{{define "logs.html"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>MikroTik Route Sync — Логи</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ .CSRF }}">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <nav class="bar">
    <span class="brand">MikroTik Route Sync</span>
    <a href="/">Дашборд</a>
    <a href="/services">Сервисы</a>
    <a href="/schedules">Расписания</a>
    <a href="/settings">Настройки</a>
    <a href="/logs" class="active">Логи</a>
    <span class="ver">v{{ .Version }}</span>
  </nav>

  <main class="wrap">
    <h1>Логи</h1>
    <p class="muted">Файл: <code>{{ .LogFile }}</code></p>

    <div class="row">
      <select id="log-level">
        <option value="">Все уровни</option>
        <option value="INFO">INFO</option>
        <option value="WARN">WARN</option>
        <option value="ERROR">ERROR</option>
      </select>
      <input type="text" id="log-service" placeholder="фильтр по сервису">
      <select id="log-limit">
        <option value="100">100 строк</option>
        <option value="500">500 строк</option>
        <option value="1000">1000 строк</option>
      </select>
      <button type="button" id="log-refresh">Обновить</button>
      <button type="button" id="log-download">Скачать</button>
      <button type="button" class="secondary" id="log-clear"
              hx-post="/actions/logs-clear" hx-swap="none"
              hx-confirm="Очистить лог-файл?">Очистить</button>
    </div>

    <article>
      <pre id="log-output" class="logs">Нажмите «Обновить»…</pre>
    </article>
  </main>
</body>
</html>
{{end}}
