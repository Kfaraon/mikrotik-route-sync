{{ define "dashboard.html" }}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ .CSRF }}">
    <title>Дашборд — MikroTik Route Sync</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/dashboard.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <!-- Навигационная панель -->
    <nav class="bar">
        <span class="brand">MikroTik Route Sync</span>
        <a href="/" class="active">Дашборд</a>
        <a href="/services">Сервисы</a>
        <a href="/address-list">Списки адресов</a>
        <a href="/schedules">Расписания</a>
        <a href="/settings">Настройки</a>
        <a href="/logs">Логи</a>
        <span class="bar-right">
            <span id="live-dot" class="{{ .DotClass }}" title="{{ .DotTitle }}"></span>
            <button type="button" class="theme-toggle" aria-label="Переключить тему">🌙</button>
        </span>
    </nav>

    <div id="dashboard-page" class="container dashboard-page">
        <div id="dash-alert" class="dash-alert" hidden></div>

        <div class="dash-grid dash-grid-3">
            <!-- Состояние системы -->
            <div class="panel">
                <div class="panel-header">
                    <h2>Состояние</h2>
                </div>
                <div class="panel-body health-list" id="health-list">
                    <div class="empty-state">Загрузка…</div>
                </div>
            </div>

            <!-- Следующие запуски -->
            <div class="panel">
                <div class="panel-header">
                    <h2>Следующие запуски</h2>
                </div>
                <div class="panel-body list" id="next-list">
                    <div class="empty-state">Загрузка…</div>
                </div>
            </div>

            <!-- Требуют внимания: сбои, ошибки и дыры качества -->
            <div class="panel">
                <div class="panel-header">
                    <h2>Требуют внимания</h2>
                </div>
                <div class="panel-body list" id="attention-list">
                    <div class="empty-state">Загрузка…</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Контейнер для уведомлений -->
    <div id="mrs-toast" class="toast"></div>

    <!-- Скрипты -->
    <script src="/static/dashboard.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
{{ end }}
