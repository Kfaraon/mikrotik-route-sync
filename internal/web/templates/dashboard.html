<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><title>MikroTik Route Sync</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/pico.min.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav><a href="/">🏠 Дашборд</a><a href="/settings">⚙️ Настройки</a><a href="/logs">📜 Логи</a></nav>
  <h1>MikroTik Route Sync</h1>
  <p class="muted">Время: <span id="clock"></span> | TZ: {{ .Timezone }}</p>
  <section id="status" hx-get="/partials/status" hx-trigger="load, every 10s" hx-swap="innerHTML"><article><p>Загрузка статуса…</p></article></section>
  <section><h2>Сервисы</h2><div id="services" hx-get="/partials/services" hx-trigger="load, every 15s" hx-swap="innerHTML"><p class="muted">Загрузка…</p></div></section>
  <section><h2>Расписания</h2><div id="schedules" hx-get="/partials/schedules" hx-trigger="load, every 30s" hx-swap="innerHTML"><p class="muted">Загрузка…</p></div></section>
  <script>
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleString(); }, 1000);
    document.body.addEventListener('htmx:configRequest', (e) => { e.detail.headers['X-CSRF-Token'] = "{{ .CSRF }}"; });
  </script>
</body>
</html>
