{{define "dashboard.html"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>MikroTik Route Sync — Дашборд</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ .CSRF }}">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="/static/dashboard.js" defer></script>
</head>
<body>
  <nav class="bar">
    <span class="brand">MikroTik Route Sync</span>
    <a href="/" class="active">Дашборд</a>
    <a href="/services">Сервисы</a>
    <a href="/schedules">Расписания</a>
    <a href="/settings">Настройки</a>
    <a href="/logs">Логи</a>
    <span class="ver">v{{ .Version }}</span>
  </nav>

  <main class="wrap dashboard-page" id="dashboard-page">
    <header class="dash-header">
      <div class="dash-title">
        <h1>Дашборд</h1>
        <p class="muted">Общее состояние RouterOS и ближайшие синхронизации.</p>
      </div>

      <div class="dash-header-actions">
        <label class="switch">
          <input type="checkbox" id="dash-auto-refresh" checked>
          <span>Автообновление</span>
        </label>
        <button type="button" id="dash-refresh" class="primary">Обновить</button>
      </div>
    </header>

    <div id="dash-alert" class="dash-alert" hidden></div>

    <section class="dash-grid dash-grid-3">
      <article class="panel">
        <div class="panel-header">
          <h2>Здоровье системы</h2>
        </div>
        <div class="panel-body health-list" id="health-list">
          <div class="empty-state">Загрузка…</div>
        </div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Ближайшие запуски</h2>
          <span class="muted">по расписанию</span>
        </div>
        <div class="panel-body list" id="next-list">
          <div class="empty-state">Загрузка…</div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
{{end}}
