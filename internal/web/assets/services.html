{{define "services.html"}}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{.Title}}</title><style>{{template "css"}}</style></head><body><nav><a href="/">← Dashboard</a></nav><main><h1>Services</h1><table><tr><th>Service</th><th>Action</th></tr>{{range .Services}}<tr><td>{{.}}</td><td><button onclick="sync('{{.}}')">🔄 Sync</button></td></tr>{{end}}</table></main><script>const csrf={{printf "%q" .CSRF}};async function sync(n){await fetch('/api/v1/services/'+encodeURIComponent(n)+'/sync',{method:'POST',headers:{'X-CSRF-Token':csrf}});alert('Accepted: '+n)}</script></body></html>{{end}}
