services:
  mikrotik-route-sync:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/data/config.yaml
      - ./data:/data
      - ./logs:/var/log/mikrotik-route-sync
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
