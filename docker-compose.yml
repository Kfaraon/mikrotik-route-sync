services:
  mrs:
    build: .
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1.0
    volumes:
     - ./config.yaml:/data/config.yaml:ro
     - cache_volume:/data/cache.db
     - ./logs:/var/log/mikrotik-route-sync
    ports:
      - "127.0.0.1:8080:8080"
