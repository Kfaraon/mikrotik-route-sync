openapi: 3.1.0
info:
  title: MikroTik Route Sync API
  description: >-
    REST API для автоматического управления маршрутами MikroTik RouterOS v7.
    Все изменяющие запросы требуют аутентификацию и CSRF-токен
    (заголовок X-CSRF-Token или поле csrf_token формы).
    Все ответы в единой схеме { ok, data, error }.
  version: 1.0.0
  contact:
    name: MikroTik Route Sync
    url: https://github.com/Kfaraon/mikrotik-route-sync
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:8080
    description: Локальный сервер (только LAN/loopback по умолчанию)

security:
  - basicAuth: []
  - sessionCookie: []

tags:
  - name: System
    description: Состояние процесса и health-check'и
  - name: Services
    description: Управление сервисами и синхронизацией
  - name: Schedules
    description: Трёхуровневые расписания
  - name: Observability
    description: Логи и история

paths:
  /healthz:
    get:
      summary: Liveness-проба (без авторизации)
      tags: [System]
      security: []
      responses:
        '200':
          description: Процесс жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /readyz:
    get:
      summary: Readiness — доступность RouterOS API и кэша (без авторизации)
      tags: [System]
      security: []
      responses:
        '200':
          description: Готов к работе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '503':
          description: Зависимость недоступна

  /api/v1/status:
    get:
      summary: Общий статус системы
      tags: [System]
      responses:
        '200':
          description: Статус
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      version: { type: string }
                      uptime: { type: string }
                      last_sync: { type: string, format: date-time }
                      mikrotik_ok: { type: boolean }
                      services:
                        type: array
                        items: { type: string }
                      degraded:
                        type: array
                        items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services:
    get:
      summary: Список сервисов с расписаниями и количеством маршрутов
      tags: [Services]
      responses:
        '200':
          description: Список сервисов
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            Name: { type: string }
                            Schedule: { type: string }
                            Routes: { type: integer }
                            Overrides: { type: boolean }
    post:
      summary: Добавить сервис
      tags: [Services]
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/{name}:
    delete:
      summary: Удалить сервис и (опционально) его AUTO-маршруты
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: purge
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/sync:
    post:
      summary: Запустить синхронизацию набора сервисов (асинхронно)
      tags: [Services]
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: array
                  items: { type: string }
                dry_run: { type: boolean, default: false }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Синхронизация запущена, результат придёт по WebSocket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/{name}/sync:
    post:
      summary: Синхронизировать один сервис (синхронно)
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Результат синхронизации
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/SyncResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Ошибка синхронизации (fail-closed, маршруты не изменены)

  /api/v1/services/{name}/dry-run:
    post:
      summary: Расчёт diff для сервиса без применения изменений
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Diff без изменений
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/SyncResult' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/schedules:
    get:
      summary: Все расписания (глобальное, группы, сервисы, эффективные)
      tags: [Schedules]
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/schedules/{service}:
    put:
      summary: Изменить расписание сервиса
      description: >-
        Форматы: cron 5 полей ("0 */6 * * *"), "every 6h", "daily at 03:00",
        "weekly on sunday at 04:00", "manual", "disabled", "inherit".
      tags: [Schedules]
      parameters:
        - name: service
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule]
              properties:
                schedule: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/logs:
    get:
      summary: Последние записи JSON-лога с фильтрацией
      tags: [Observability]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 10000 } }
        - { name: level, in: query, schema: { type: string, enum: [DEBUG, INFO, WARN, ERROR] } }
        - { name: service, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/history:
    get:
      summary: История синхронизаций
      tags: [Observability]
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/ws:
    get:
      summary: WebSocket live-событий (sync_start, sync_done, sync_error, service_added, ...)
      tags: [Observability]
      responses:
        '101':
          description: Switching Protocols

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    sessionCookie:
      type: apiKey
      in: cookie
      name: mrs_session

  responses:
    OK:
      description: Успешный ответ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    BadRequest:
      description: Некорректный запрос
    Unauthorized:
      description: Требуется аутентификация
    Forbidden:
      description: Доступ запрещён (CSRF, allowed_cidrs или авторизация)

  schemas:
    Envelope:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        data: {}
        error: { type: string }

    SyncResult:
      type: object
      properties:
        service: { type: string }
        success: { type: boolean }
        added: { type: integer }
        removed: { type: integer }
        unchanged: { type: integer }
        error: { type: string }
        dry_run: { type: boolean }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration: { type: string }
        version: { type: string }
