openapi: 3.1.0
info:
  title: MikroTik Route Sync API
  description: >-
    REST API для автоматического управления Firewall Address List в MikroTik RouterOS v7
    (один глобальный список firewall.address_list, изоляция сервисов по comment AUTO:<service>).
    Все изменяющие запросы требуют аутентификацию и CSRF-токен
    (заголовок X-CSRF-Token или поле csrf_token формы).
    Все ответы в единой схеме { ok, data, error }.
  version: 1.0.0
  contact:
    name: MikroTik Route Sync
    url: https://github.com/Kfaraon/mikrotik-route-sync
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:8080
    description: Локальный сервер (только LAN/loopback по умолчанию)

security:
  - basicAuth: []
  - sessionCookie: []

tags:
  - name: System
    description: Состояние процесса и health-check'и
  - name: Services
    description: Управление сервисами и синхронизацией
  - name: Presets
    description: Пресеты сервисов и зеркала (v2fly, rublock)
  - name: Schedules
    description: Трёхуровневые расписания
  - name: Observability
    description: Логи и история
  - name: Address List
    description: Записи Firewall Address List

paths:
  /healthz:
    get:
      summary: Liveness-проба (без авторизации)
      tags: [System]
      security: []
      responses:
        '200':
          description: Процесс жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /readyz:
    get:
      summary: Readiness — доступность RouterOS address-list API и кэша (без авторизации)
      tags: [System]
      security: []
      responses:
        '200':
          description: Готов к работе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '503':
          description: Зависимость недоступна

  /api/v1/status:
    get:
      summary: Общий статус системы
      tags: [System]
      responses:
        '200':
          description: Статус
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      version: { type: string }
                      uptime: { type: string }
                      last_sync: { type: string, format: date-time }
                      mikrotik_ok: { type: boolean }
                      services:
                        type: array
                        items: { type: string }
                      degraded:
                        type: array
                        items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/progress:
    get:
      summary: Активные синхронизации — фаза и процент
      description: >-
        In-memory карта «сервис → {service, phase, percent, dry_run}»: заполняется
        по ходу SyncService (12 фаз, 5%…95%) и очищается при завершении.
        Без обращений к RouterOS; поллится страницей «Сервисы» каждые ~900 мс.
      tags: [Services]
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services:
    get:
      summary: Список сервисов с расписаниями и числом управляемых записей
      tags: [Services]
      responses:
        '200':
          description: Список сервисов
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            Name: { type: string }
                            Schedule: { type: string }
                            Routes: { type: integer, description: Число управляемых address-list записей }
                            Overrides: { type: boolean }
                            GUID:
                              type: string
                              description: >-
                                UUID v4 текущего воплощения сервиса. Пусто у
                                сервисов, добавленных до появления
                                идентификаторов. Служит для отсечения истории
                                и логов прежнего сервиса с тем же именем.
    post:
      summary: Добавить сервис
      tags: [Services]
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/{name}:
    put:
      summary: Изменить override сервиса (method, domains)
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  example: dynamic,whois
                  description: null — не трогать, пустая строка — сбросить в авто
                domains:
                  type: array
                  items: { type: string }
                  description: null — не трогать, иначе заменить целиком
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Удалить сервис и (опционально) его AUTO-маршруты
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: purge
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Сервис не найден в конфигурации

  /api/v1/services/sync:
    post:
      summary: Запустить синхронизацию набора сервисов (асинхронно)
      tags: [Services]
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: array
                  items: { type: string }
                dry_run: { type: boolean, default: false }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Синхронизация запущена в фоне; прогресс — GET /api/v1/progress, результат — GET /api/v1/history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/add-status:
    get:
      summary: Прогресс фонового добавления сервиса
      description: >-
        In-memory карта «сервис → текст текущего шага» (резолв доменов и т. п.),
        заполняется при POST /api/v1/services и очищается по завершении. Пустой
        detail и active=false — добавление не идёт.
      tags: [Services]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Состояние добавления
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      active: { type: boolean }
                      detail: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{name}/sync:
    post:
      summary: Синхронизировать один сервис (синхронно)
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Результат синхронизации
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/SyncResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Ошибка синхронизации (fail-closed, маршруты не изменены)

  /api/v1/services/{name}/dry-run:
    post:
      summary: Расчёт diff для сервиса без применения изменений
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Diff без изменений
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/SyncResult' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/{name}/recommend:
    post:
      summary: Подбор источника — проверка, не обслуживается ли сервис за CDN
      description: >-
        Резолвит A-записи доменов, определяет ASN и сверяет адреса с
        официальными списками CDN (Cloudflare, AWS CloudFront, Google, Fastly).
        Тело {"apply": true} применяет рекомендацию: удаляет старые
        AUTO-записи сервиса и переключает override на method: cdn.
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apply: { type: boolean, default: false }
      responses:
        '200':
          description: Рекомендация (и, при apply, результат применения)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      advice:
                        type: object
                        properties:
                          detected: { type: boolean }
                          cdn: { type: string, example: Cloudflare }
                          asn: { type: integer, example: 13335 }
                          url: { type: string, example: 'https://www.cloudflare.com/ips-v4' }
                          prefix_count: { type: integer, example: 15 }
                          whois_count: { type: integer, example: 86 }
                          domains: { type: array, items: { type: string } }
                          ips: { type: array, items: { type: string } }
                          skipped: { type: array, items: { type: string } }
                          current_method: { type: string, example: whois }
                          recommend: { type: boolean }
                          reason: { type: string }
                          coverage:
                            type: object
                            properties:
                              checked: { type: integer }
                              covered: { type: integer }
                              uncovered: { type: array, items: { type: string } }
                          broad: { type: array, items: { type: string } }
                          verification:
                            type: array
                            items:
                              type: object
                              properties:
                                domain: { type: string }
                                checked: { type: integer }
                                ok: { type: integer }
                                failed: { type: array, items: { type: string } }
                      applied: { type: boolean }
                      purged: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/{name}/blockcheck:
    post:
      summary: Проверить домены сервиса по RU-блоклисту (rublock)
      description: >-
        Сверяет домены override сервиса со скачанным RU-зеркалом (rublock).
        Доступен только для сервисов из конфига; сервис без доменов даёт пустой
        список. Кэшируется по версии зеркала.
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Заблокированные домены
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      service: { type: string }
                      blocked: { type: array, items: { type: string } }
                      blocked_count: { type: integer }
                      total: { type: integer }
                      cached: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Блоклист недоступен (RU-зеркало не скачано)

  /api/v1/services/{name}/refresh-preset:
    post:
      summary: Пересчитать домены сервиса из пресета, сохранив ручные
      description: >-
        Отвечает diff'ом (added/removed); маршруты не меняются — для применения
        нужен обычный sync/dry-run. Пустое тело — привязанный пресет.
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                preset: { type: string, description: slug пресета; пусто — привязанный }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Diff пересчёта (без применения)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      service: { type: string }
                      added: { type: array, items: { type: string } }
                      removed: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/{name}/suggest-domains:
    post:
      summary: Подбор смежных доменов сервиса через urlscan
      description: >-
        Советник: возвращает только кандидатов и диагностику, ничего не пишет.
        Пустое тело — дефолтное число сканов.
      tags: [Services]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scans: { type: integer }
      responses:
        '200':
          description: Кандидаты и диагностика подбора
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      reason: { type: string }
                      source: { type: string }
                      query: { type: string }
                      mode: { type: string, enum: [off, key, anonymous] }
                      scans_considered: { type: integer }
                      cached: { type: boolean }
                      fetched_at: { type: string, format: date-time }
                      candidates:
                        type: array
                        items:
                          type: object
                          properties:
                            domain: { type: string }
                            apex: { type: string }
                            scans: { type: integer }
                            requests: { type: integer }
                            confidence: { type: string, enum: [high, medium, low] }
                      excluded:
                        type: array
                        items:
                          type: object
                          properties:
                            domain: { type: string }
                            reason: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/presets:
    get:
      summary: Каталог пресетов и состояние зеркал (mirror, upstream)
      description: >-
        Лёгкие пресеты вшиты в бинарь; тяжёлые (rublock, upstream) читаются из
        runtime-зеркала. Домены large-пресетов в каталог не включаются.
      tags: [Presets]
      responses:
        '200':
          description: Каталог с состоянием зеркал
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      presets: { type: array, items: { $ref: '#/components/schemas/PresetMeta' } }
                      mirror:
                        description: Состояние RU-зеркала (null — не скачано)
                        oneOf: [{ $ref: '#/components/schemas/MirrorMeta' }, { type: 'null' }]
                      upstream:
                        description: Состояние v2fly-зеркала (null — не скачано)
                        oneOf: [{ $ref: '#/components/schemas/UpstreamMeta' }, { type: 'null' }]
                      suggest:
                        type: object
                        properties:
                          v2fly: { type: boolean }
                          ru: { type: boolean }
                          mode: { type: string, enum: [off, key, anonymous] }
                          sources: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/presets/match:
    get:
      summary: Какие пресеты содержат домен (инвертированный индекс v2fly)
      description: Пусто — зеркало v2fly не скачано или совпадений нет.
      tags: [Presets]
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Совпадения (вендоренные — первыми)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      matches:
                        type: array
                        items:
                          type: object
                          properties:
                            slug: { type: string }
                            title: { type: string }
                            vendored: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/presets/refresh:
    post:
      summary: Ручная докачка зеркал пресетов
      description: >-
        source=ru качает RU-блоклист (antifilter → rublock), source=upstream —
        каталог v2fly, source=all — оба. Скачивается десятки МБ, операция может
        занять минуты и продолжается на сервере даже при обрыве клиента.
        Параллельный повторный запуск отклоняется (429).
      tags: [Presets]
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [ru, upstream, all], default: all } }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Зеркала обновлены
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      ru: { $ref: '#/components/schemas/MirrorStatus' }
                      upstream: { $ref: '#/components/schemas/UpstreamMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: Обновление этого источника уже выполняется
        '502':
          description: Источник недоступен или ответ битый

  /api/v1/presets/create-from-upstream:
    post:
      summary: Создать пресет из файла v2fly-зеркала (runtime-каталог)
      description: >-
        Берёт файл data/<slug> из скачанного v2fly-зеркала с полной картой
        соседних include:, сохраняет как кастомный пресет <slug>.yaml в
        runtime-каталоге (DiskDir) и сбрасывает кэш. Ответ содержит предупреждение,
        если список урезан до presets.MaxDomains.
      tags: [Presets]
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: { type: string, description: 'имя файла данных v2fly (a-z0-9_-)' }
      responses:
        '200':
          description: Пресет создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      slug: { type: string }
                      title: { type: string }
                      domains: { type: integer }
                      method: { type: string }
                      source: { type: string }
                      truncated: { type: integer }
                      showcase: { type: string }
                      warning: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: v2fly-зеркало не скачано или файл slug не найден
        '500':
          description: Ошибка записи пресета

  /api/v1/schedules:
    get:
      summary: Все расписания (глобальное, сервисы, эффективные)
      tags: [Schedules]
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/schedules/global:
    put:
      summary: Изменить глобальное расписание
      description: >-
        Форматы: cron 5 полей ("0 */6 * * *"), "every 6h", "daily at 03:00",
        "weekly on sunday at 04:00", "manual", "disabled". Пустая строка
        снимает наследуемое по умолчанию расписание. Маршрут статический,
        поэтому не перехватывается `/api/v1/schedules/{service}`.
      tags: [Schedules]
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule]
              properties:
                schedule: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/schedules/{service}:
    put:
      summary: Изменить расписание сервиса
      description: >-
        Форматы: cron 5 полей ("0 */6 * * *"), "every 6h", "daily at 03:00",
        "weekly on sunday at 04:00", "manual", "disabled", "inherit".
      tags: [Schedules]
      parameters:
        - name: service
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule]
              properties:
                schedule: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/logs:
    get:
      summary: Последние записи JSON-лога с фильтрацией
      tags: [Observability]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 10000 } }
        - { name: level, in: query, schema: { type: string, enum: [DEBUG, INFO, WARN, ERROR] } }
        - { name: service, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/history:
    get:
      summary: История синхронизаций
      description: >-
        Записи несут `service_id` (UUID воплощения). При запросе с
        `service=` возвращаются только записи текущего воплощения сервиса.
      tags: [Observability]
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/address-list:
    get:
      summary: Записи глобального Firewall Address List
      description: >-
        Возвращает все записи `firewall.address_list`. Поле `Managed`
        отмечает управляемые программой записи (comment=AUTO:<активный сервис>).
      tags: [Address List]
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: RouterOS недоступен

  /api/v1/address-list/{service}:
    get:
      summary: Управляемые записи конкретного сервиса
      tags: [Address List]
      parameters:
        - name: service
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503':
          description: RouterOS недоступен

  /api/v1/ws:
    get:
      summary: WebSocket live-событий (sync_start, sync_progress, sync_done, sync_error, service_added, ...)
      tags: [Observability]
      responses:
        '101':
          description: Switching Protocols

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    sessionCookie:
      type: apiKey
      in: cookie
      name: mrs_session

  responses:
    OK:
      description: Успешный ответ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    BadRequest:
      description: Некорректный запрос
    Unauthorized:
      description: Требуется аутентификация
    Forbidden:
      description: Доступ запрещён (CSRF, allowed_cidrs или авторизация)

  schemas:
    Envelope:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        data: {}
        error: { type: string }

    SyncResult:
      type: object
      properties:
        service: { type: string }
        success: { type: boolean }
        added: { type: integer }
        removed: { type: integer }
        unchanged: { type: integer }
        error: { type: string }
        dry_run: { type: boolean }
        coverage:
          type: object
          properties:
            checked: { type: integer }
            covered: { type: integer }
            uncovered: { type: array, items: { type: string } }
        broad: { type: array, items: { type: string } }
        rejected:
          type: object
          properties:
            ipv6: { type: integer }
            blocked: { type: integer }
            too_broad: { type: integer }
            host_routes: { type: integer }
            excluded: { type: integer }
            not_included: { type: integer }
        verification:
          type: array
          items:
            type: object
            properties:
              domain: { type: string }
              checked: { type: integer }
              ok: { type: integer }
              failed: { type: array, items: { type: string } }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration: { type: string }
        version: { type: string }

    PresetMeta:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        method: { type: string }
        large: { type: boolean }
        count: { type: integer }
        domains:
          type: array
          items: { type: string }

    MirrorMeta:
      type: object
      description: Состояние RU-зеркала (mirror.json)
      properties:
        updated_at: { type: string, format: date-time }
        source: { type: string }
        entries: { type: integer }

    MirrorStatus:
      type: object
      description: Итог RefreshMirror
      properties:
        entries: { type: integer }
        updated_at: { type: string, format: date-time }

    UpstreamMeta:
      type: object
      description: Состояние v2fly-зеркала (upstream.json)
      properties:
        updated_at: { type: string, format: date-time }
        source: { type: string }
        files: { type: integer }
        size: { type: integer, format: int64 }
