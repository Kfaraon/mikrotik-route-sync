<h1>Настройки</h1>

<h2>MikroTik</h2>
<table>
  <tr><td>Host</td><td><input name="mikrotik.host" value="{{ .MikroTik.Host }}"></td>
      <td><button hx-post="/actions/config/set" hx-include="closest tr" hx-vals='{"key":"mikrotik.host"}'>💾</button></td></tr>
  <tr><td>Username</td><td><input name="mikrotik.username" value="{{ .MikroTik.Username }}"></td>
      <td><button hx-post="/actions/config/set" hx-include="closest tr" hx-vals='{"key":"mikrotik.username"}'>💾</button></td></tr>
  <tr><td>Password</td><td><input name="mikrotik.password" type="password" value="{{ .MikroTik.Password }}"></td>
      <td><button hx-post="/actions/config/set" hx-include="closest tr" hx-vals='{"key":"mikrotik.password"}'>💾</button></td></tr>
  <tr><td>Gateway</td><td><input name="mikrotik.gateway" value="{{ .MikroTik.Gateway }}"></td>
      <td><button hx-post="/actions/config/set" hx-include="closest tr" hx-vals='{"key":"mikrotik.gateway"}'>💾</button></td></tr>
</table>

<h2>Telegram</h2>
<table>
  <tr><td>Bot Token</td><td><input name="telegram.bot_token" type="password" value="{{ .Telegram.BotToken }}"></td>
      <td><button hx-post="/actions/config/set" hx-include="closest tr" hx-vals='{"key":"telegram.bot_token"}'>💾</button></td></tr>
  <tr><td>Chat ID</td><td><input name="telegram.chat_id" value="{{ .Telegram.ChatID }}"></td>
      <td><button hx-post="/actions/config/set" hx-include="closest tr" hx-vals='{"key":"telegram.chat_id"}'>💾</button></td></tr>
</table>

<h2>Web</h2>
<table>
  <tr><td>Username</td><td><input name="web.auth.username" value="{{ .Web.Auth.Username }}"></td>
      <td><button hx-post="/actions/config/set" hx-include="closest tr" hx-vals='{"key":"web.auth.username"}'>💾</button></td></tr>
  <tr><td>Password</td><td><input name="web.auth.password" type="password" value="{{ .Web.Auth.Password }}"></td>
      <td><button hx-post="/actions/config/set" hx-include="closest tr" hx-vals='{"key":"web.auth.password"}'>💾</button></td></tr>
</table>

<div id="save-result"></div>

<script>
  document.body.addEventListener('htmx:configRequest', (e) => {
    e.detail.headers['X-CSRF-Token'] = "{{ .CSRF }}";
  });
</script>
